# This workflow builds and tests the Swift port of SMBJ
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Build SMBJ-Swift

on:
  push:
    branches: [ master ]
    paths:
      - 'smbj-swift/**'
      - '.github/workflows/swift.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'smbj-swift/**'
      - '.github/workflows/swift.yml'

jobs:
  build-macos:
    name: Build & Test on macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: smbj-swift
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: smbj-swift/.build
        key: ${{ runner.os }}-spm-${{ hashFiles('smbj-swift/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: swift package resolve

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v

  build-ios:
    name: Build & Test for iOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: smbj-swift
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Build for iOS Simulator
      run: |
        xcodebuild build \
          -scheme SMBJ \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath .build/ios \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests on iOS Simulator
      run: |
        xcodebuild test \
          -scheme SMBJ \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath .build/ios \
          CODE_SIGNING_ALLOWED=NO

  lint:
    name: Swift Lint
    runs-on: macos-14
    defaults:
      run:
        working-directory: smbj-swift
    steps:
    - uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging || true
